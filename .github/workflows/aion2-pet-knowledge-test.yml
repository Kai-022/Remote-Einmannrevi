name: AION 2 Pet Knowledge Test
on:
  push:
    paths:
      - 'aion2-gear-checker/pet-species.js'
      - 'aion2-gear-checker/pet-species.css'
      - 'aion2-gear-checker/tests/pet-species.mjs'
      - 'aion2-gear-checker/index.html'
      - '.github/workflows/aion2-pet-knowledge-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pet-knowledge-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Pet UI
        run: |
          node --check aion2-gear-checker/pet-species.js
          node aion2-gear-checker/tests/pet-species.mjs
