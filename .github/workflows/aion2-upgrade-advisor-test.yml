name: AION 2 Upgrade Advisor Test
on:
  workflow_dispatch:
  push:
    paths:
      - 'aion2-gear-checker/upgrade-advisor-core.js'
      - 'aion2-gear-checker/upgrade-advisor.js'
      - 'aion2-gear-checker/tests/upgrade-advisor.mjs'
      - 'aion2-gear-checker/index.html'
      - '.github/workflows/aion2-upgrade-advisor-test.yml'
permissions:
  contents: read
jobs:
  advisor-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check scripts
        run: |
          node --check aion2-gear-checker/upgrade-advisor-core.js
          node --check aion2-gear-checker/upgrade-advisor.js
      - name: Test EU profile upgrade recommendations
        run: node aion2-gear-checker/tests/upgrade-advisor.mjs
