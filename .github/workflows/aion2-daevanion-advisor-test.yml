name: AION 2 Daevanion Advisor Test
on:
  push:
    paths:
      - 'aion2-gear-checker/daevanion-eu-comparison.js'
      - 'aion2-gear-checker/daevanion-guide-codec.js'
      - 'aion2-gear-checker/daevanion-guide-import.js'
      - 'aion2-gear-checker/daevanion-guide-plan-core.js'
      - 'aion2-gear-checker/daevanion-guide-steps.js'
      - 'aion2-gear-checker/tests/daevanion-guide-steps.mjs'
      - 'aion2-gear-checker/tests/daevanion-guide-import.mjs'
      - 'aion2-gear-checker/daevanion-eu-cleric-meta.json'
      - 'aion2-gear-checker/cleric-board-references.json'
      - 'aion2-gear-checker/nc-visuals.js'
      - 'aion2-gear-checker/armory.html'
      - 'aion2-gear-checker/tests/daevanion-advisor.mjs'
      - '.github/workflows/aion2-daevanion-advisor-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-advisor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Daevanion node planner
        run: |
          node --check aion2-gear-checker/daevanion-eu-comparison.js
          node --check aion2-gear-checker/nc-visuals.js
          node aion2-gear-checker/tests/daevanion-advisor.mjs
          node --check aion2-gear-checker/daevanion-guide-codec.js
          node --check aion2-gear-checker/daevanion-guide-import.js
          node aion2-gear-checker/tests/daevanion-guide-import.mjs
          node --check aion2-gear-checker/daevanion-guide-plan-core.js
          node --check aion2-gear-checker/daevanion-guide-steps.js
          node aion2-gear-checker/tests/daevanion-guide-steps.mjs
