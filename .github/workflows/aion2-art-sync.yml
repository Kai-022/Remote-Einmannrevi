name: AION 2 Cache Board Art
on:
  workflow_dispatch:
  push:
    paths:
      - 'aion2-gear-checker/cache-daevanion-art.py'
      - '.github/workflows/aion2-art-sync.yml'
permissions:
  contents: write
concurrency:
  group: aion2-cleric-art-cache
  cancel-in-progress: false
jobs:
  cache-cleric-art:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Cache original skill icons and board frames
        run: python3 aion2-gear-checker/cache-daevanion-art.py
      - name: Record cached game artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aion2-gear-checker/nc-icons
          if ! git diff --cached --quiet; then
            git commit -m "Store original NCSOFT Cleric skill and Daevanion board images"
            git pull --rebase origin main
            git push
          fi
